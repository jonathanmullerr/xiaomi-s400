name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[dev]'
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m unittest discover -s tests -v
      - run: python -m build
      - name: Clean wheel installation
        run: |
          python -m venv /tmp/s400-wheel
          /tmp/s400-wheel/bin/python -m pip install dist/*.whl
          /tmp/s400-wheel/bin/xiaomi-s400 --version
          /tmp/s400-wheel/bin/xiaomi-s400 --help
          /tmp/s400-wheel/bin/python -m unittest discover -s tests -v
      - uses: actions/upload-artifact@v4
        with:
          name: distributions-${{ matrix.python }}
          path: dist/*
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t xiaomi-s400:test .
      - run: docker run --rm xiaomi-s400:test --version
      - name: Synthetic tests inside Docker
        run: docker run --rm --entrypoint python -v "$PWD/tests:/tests:ro" xiaomi-s400:test -m unittest discover -s /tests -v
